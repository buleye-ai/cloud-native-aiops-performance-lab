<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
  <title id="title">2017 到 2026 生成式 AI 工程演进史</title><desc id="desc">从 Transformer、基础模型、代码补全、聊天、RAG 和工具调用，演进到 Agent、MCP、Coding Agent、Skills 与长期个人 Agent。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#25133d"/></linearGradient><linearGradient id="line" x2="1"><stop stop-color="#38bdf8"/><stop offset=".55" stop-color="#2dd4bf"/><stop offset="1" stop-color="#c084fc"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity=".25"/></filter><style>.t{font:700 37px Inter,"PingFang SC",sans-serif;fill:#f8fafc}.s{font:400 17px Inter,"PingFang SC",sans-serif;fill:#a5b4fc}.y{font:700 20px Inter,"PingFang SC",sans-serif;fill:#e0f2fe}.h{font:700 18px Inter,"PingFang SC",sans-serif;fill:#f8fafc}.p{font:400 14px Inter,"PingFang SC",sans-serif;fill:#cbd5e1}.note{font:500 16px Inter,"PingFang SC",sans-serif;fill:#fde68a}</style></defs>
  <rect width="1600" height="780" rx="30" fill="url(#bg)"/><text x="65" y="68" class="t">AI 没有突然爆炸：它是逐层补齐“从回答到行动”</text><text x="65" y="104" class="s">每一波热门名词，通常只是把上一代缺少的一块工程能力补上</text>
  <line x1="100" y1="390" x2="1500" y2="390" stroke="url(#line)" stroke-width="7" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <circle cx="130" cy="390" r="15" fill="#38bdf8"/><rect x="55" y="170" width="190" height="170" rx="20" fill="#0c4a6e" stroke="#38bdf8"/><text x="80" y="207" class="y">2017</text><text x="80" y="240" class="h">Transformer</text><text x="80" y="272" class="p">让模型更好地</text><text x="80" y="296" class="p">理解长距离关系</text><text x="80" y="320" class="p">奠定 LLM 基础</text>
    <circle cx="320" cy="390" r="15" fill="#38bdf8"/><rect x="250" y="445" width="205" height="170" rx="20" fill="#172554" stroke="#818cf8"/><text x="275" y="482" class="y">2018–2020</text><text x="275" y="515" class="h">预训练大模型</text><text x="275" y="547" class="p">BERT · GPT 系列</text><text x="275" y="571" class="p">通用能力形成</text><text x="275" y="595" class="p">但主要仍是生成</text>
    <circle cx="515" cy="390" r="15" fill="#2dd4bf"/><rect x="455" y="170" width="205" height="170" rx="20" fill="#134e4a" stroke="#2dd4bf"/><text x="480" y="207" class="y">2021</text><text x="480" y="240" class="h">AI 代码补全</text><text x="480" y="272" class="p">GitHub Copilot</text><text x="480" y="296" class="p">从聊天走进 IDE</text><text x="480" y="320" class="p">仍需人完成流程</text>
    <circle cx="710" cy="390" r="15" fill="#2dd4bf"/><rect x="660" y="445" width="205" height="170" rx="20" fill="#164e3c" stroke="#34d399"/><text x="685" y="482" class="y">2022</text><text x="685" y="515" class="h">聊天成为入口</text><text x="685" y="547" class="p">ChatGPT 普及</text><text x="685" y="571" class="p">自然语言即界面</text><text x="685" y="595" class="p">AI 进入大众视野</text>
    <circle cx="905" cy="390" r="15" fill="#eab308"/><rect x="865" y="170" width="205" height="170" rx="20" fill="#3f3f16" stroke="#eab308"/><text x="890" y="207" class="y">2023</text><text x="890" y="240" class="h">知识 + 工具</text><text x="890" y="272" class="p">RAG · Function Calling</text><text x="890" y="296" class="p">AutoGPT · ReAct</text><text x="890" y="320" class="p">开始形成 Agent Loop</text>
    <circle cx="1100" cy="390" r="15" fill="#fb923c"/><rect x="1070" y="445" width="210" height="170" rx="20" fill="#431407" stroke="#fb923c"/><text x="1095" y="482" class="y">2024</text><text x="1095" y="515" class="h">Agent 工程化</text><text x="1095" y="547" class="p">Devin · OpenHands</text><text x="1095" y="571" class="p">MCP 统一工具接入</text><text x="1095" y="595" class="p">Agent 开始做完整任务</text>
    <circle cx="1295" cy="390" r="15" fill="#f472b6"/><rect x="1275" y="170" width="210" height="170" rx="20" fill="#4c1d45" stroke="#f472b6"/><text x="1300" y="207" class="y">2025</text><text x="1300" y="240" class="h">Coding Agent 爆发</text><text x="1300" y="272" class="p">Codex · Claude Code</text><text x="1300" y="296" class="p">A2A · AGENTS.md</text><text x="1300" y="320" class="p">从建议走向交付</text>
    <circle cx="1490" cy="390" r="15" fill="#c084fc"/>
  </g>
  <rect x="1260" y="645" width="285" height="88" rx="22" fill="#3b0764" stroke="#c084fc"/><text x="1285" y="680" class="y">2026</text><text x="1355" y="680" class="h">长期 Agent</text><text x="1285" y="711" class="p">Skills · Hermes · Pi · OpenClaw</text>
  <text x="65" y="700" class="note">今天看见的新产品，多数不是发明了一种新智能，而是重新组合：模型 + 工具 + 记忆 + Loop + Harness + 入口。</text>
  <style>
    .t,.y,.h{fill:#1f2933}.s{fill:#66717a}.p{fill:#3f4a52}.note{fill:#874a36}
    rect{filter:none;rx:8px}[filter]{filter:none}
    stop[stop-color="#071426"]{stop-color:#f7f3eb} stop[stop-color="#25133d"]{stop-color:#ebe6dc}
    [fill="#0c4a6e"],[fill="#172554"],[fill="#134e4a"],[fill="#164e3c"],[fill="#3f3f16"],[fill="#431407"],[fill="#4c1d45"],[fill="#3b0764"]{fill:#fffdf8}
    [stroke="#38bdf8"],[stroke="#818cf8"],[stroke="#2dd4bf"],[stroke="#34d399"],[stroke="#eab308"],[stroke="#fb923c"],[stroke="#f472b6"],[stroke="#c084fc"]{stroke:#9aa4a8}
    circle{fill:#365b73} line[stroke="url(#line)"]{stroke:#365b73}
  </style>
</svg>
