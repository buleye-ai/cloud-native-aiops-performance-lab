<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">MCP Host Client Server 架构</title><desc id="desc">人通过 MCP Host 连接多个 MCP Client，每个 Client 对应一个 MCP Server 和外部系统。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081421"/><stop offset="1" stop-color="#132b38"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#67e8f9"/></marker><style>.t{font:700 35px Inter,"PingFang SC",sans-serif;fill:#f8fafc}.s{font:400 17px Inter,"PingFang SC",sans-serif;fill:#94a3b8}.h{font:700 20px Inter,"PingFang SC",sans-serif;fill:#f8fafc}.p{font:400 15px Inter,"PingFang SC",sans-serif;fill:#cbd5e1}.l{stroke:#67e8f9;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1440" height="720" rx="28" fill="url(#bg)"/><text x="70" y="70" class="t">MCP：让 Agent 与工具解耦</text><text x="70" y="106" class="s">统一的是连接、能力发现与消息交换，不负责 Agent 如何规划</text>
  <rect x="60" y="275" width="150" height="120" rx="60" fill="#312e81" stroke="#818cf8"/><text x="110" y="325" class="h">人</text><text x="90" y="357" class="p">目标与审批</text>
  <rect x="290" y="225" width="270" height="220" rx="24" fill="#0c4a6e" stroke="#38bdf8"/><text x="330" y="275" class="h">MCP Host</text><text x="330" y="310" class="p">Codex · Claude Code · IDE</text><line x1="330" y1="340" x2="520" y2="340" stroke="#38bdf8" opacity=".5"/><text x="330" y="378" class="p">上下文 · 权限 · 用户交互</text><text x="330" y="410" class="p">每个 Server 对应一个 Client</text>
  <g><rect x="650" y="150" width="180" height="105" rx="18" fill="#134e4a" stroke="#2dd4bf"/><text x="680" y="193" class="h">MCP Client A</text><text x="680" y="225" class="p">独立会话</text><rect x="650" y="307" width="180" height="105" rx="18" fill="#134e4a" stroke="#2dd4bf"/><text x="680" y="350" class="h">MCP Client B</text><text x="680" y="382" class="p">独立会话</text><rect x="650" y="464" width="180" height="105" rx="18" fill="#134e4a" stroke="#2dd4bf"/><text x="680" y="507" class="h">MCP Client C</text><text x="680" y="539" class="p">独立会话</text></g>
  <g><rect x="930" y="140" width="220" height="125" rx="20" fill="#3f3f16" stroke="#facc15"/><text x="965" y="186" class="h">GitHub Server</text><text x="965" y="220" class="p">Tools · Resources</text><rect x="930" y="297" width="220" height="125" rx="20" fill="#3f3f16" stroke="#facc15"/><text x="965" y="343" class="h">Prometheus Server</text><text x="965" y="377" class="p">Query · Metadata</text><rect x="930" y="454" width="220" height="125" rx="20" fill="#3f3f16" stroke="#facc15"/><text x="965" y="500" class="h">CMDB Server</text><text x="965" y="534" class="p">Resource · Search</text></g>
  <g><rect x="1240" y="140" width="145" height="125" rx="20" fill="#431407" stroke="#fb923c"/><text x="1276" y="194" class="h">GitHub</text><text x="1272" y="228" class="p">External API</text><rect x="1240" y="297" width="145" height="125" rx="20" fill="#431407" stroke="#fb923c"/><text x="1257" y="351" class="h">Metrics</text><text x="1272" y="385" class="p">Time Series</text><rect x="1240" y="454" width="145" height="125" rx="20" fill="#431407" stroke="#fb923c"/><text x="1276" y="508" class="h">CMDB</text><text x="1270" y="542" class="p">Database</text></g>
  <path class="l" d="M210 335H280"/><path class="l" d="M560 290C600 290 600 202 640 202"/><path class="l" d="M560 335H640"/><path class="l" d="M560 380C600 380 600 516 640 516"/><path class="l" d="M830 202H920"/><path class="l" d="M830 359H920"/><path class="l" d="M830 516H920"/><path class="l" d="M1150 202H1230"/><path class="l" d="M1150 359H1230"/><path class="l" d="M1150 516H1230"/>
  <rect x="290" y="625" width="860" height="50" rx="25" fill="#0f172a" stroke="#334155"/><text x="420" y="657" class="p">同一个 MCP Server 可以被不同 Host 复用，权限仍由 Host 与 Server 共同约束</text>
  <style>
    .t,.h{fill:#1f2933}.s{fill:#66717a}.p{fill:#3f4a52}.l{stroke:#365b73}
    rect{filter:none;rx:8px}
    stop[stop-color="#081421"]{stop-color:#f7f3eb} stop[stop-color="#132b38"]{stop-color:#ebe6dc}
    [fill="#312e81"],[fill="#0c4a6e"],[fill="#134e4a"],[fill="#3f3f16"],[fill="#431407"],[fill="#0f172a"]{fill:#fffdf8}
    [stroke="#818cf8"],[stroke="#38bdf8"],[stroke="#2dd4bf"],[stroke="#facc15"],[stroke="#fb923c"],[stroke="#334155"]{stroke:#9aa4a8}[fill="#67e8f9"]{fill:#365b73}
  </style>
</svg>
