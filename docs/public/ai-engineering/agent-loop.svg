<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Agent Loop 闭环</title><desc id="desc">Agent 从目标开始，观察、规划、行动、取得证据并判断是否完成。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#24133b"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#c4b5fd"/></marker><style>.t{font:700 35px Inter,"PingFang SC",sans-serif;fill:#f8fafc}.s{font:400 17px Inter,"PingFang SC",sans-serif;fill:#94a3b8}.h{font:700 20px Inter,"PingFang SC",sans-serif;fill:#f8fafc}.p{font:400 15px Inter,"PingFang SC",sans-serif;fill:#cbd5e1}.l{stroke:#c4b5fd;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg)"/><text x="62" y="66" class="t">Agent Loop：用环境证据持续推进</text><text x="62" y="102" class="s">可靠的循环必须有完成条件、预算、停止条件和人工接管点</text>
  <circle cx="600" cy="410" r="220" fill="#0f172a" stroke="#4c1d95" stroke-width="2" stroke-dasharray="10 10"/>
  <rect x="485" y="140" width="230" height="90" rx="45" fill="#312e81" stroke="#818cf8"/><text x="548" y="177" class="h">Goal 目标</text><text x="523" y="207" class="p">定义成功与边界</text>
  <rect x="175" y="270" width="240" height="100" rx="22" fill="#0c4a6e" stroke="#38bdf8"/><text x="215" y="311" class="h">Observe 观察</text><text x="215" y="342" class="p">读取上下文与环境</text>
  <rect x="175" y="485" width="240" height="100" rx="22" fill="#134e4a" stroke="#2dd4bf"/><text x="215" y="526" class="h">Plan 规划</text><text x="215" y="557" class="p">选择有信息增益的下一步</text>
  <rect x="785" y="485" width="240" height="100" rx="22" fill="#431407" stroke="#fb923c"/><text x="825" y="526" class="h">Act 行动</text><text x="825" y="557" class="p">调用工具改变或查询环境</text>
  <rect x="785" y="270" width="240" height="100" rx="22" fill="#4c1d45" stroke="#f472b6"/><text x="825" y="311" class="h">Evidence 证据</text><text x="825" y="342" class="p">读取真实执行结果</text>
  <path class="l" d="M525 230C470 245 430 265 405 290"/><path class="l" d="M295 370V475"/><path class="l" d="M415 535H775"/><path class="l" d="M905 485V380"/><path class="l" d="M785 320C720 250 570 250 415 300"/>
  <rect x="460" y="350" width="280" height="125" rx="25" fill="#3b0764" stroke="#c084fc"/><text x="505" y="398" class="h">完成条件满足？</text><text x="505" y="432" class="p">是 → 交付结果与证据</text><text x="505" y="458" class="p">否 → 进入下一轮</text>
  <rect x="260" y="650" width="680" height="58" rx="29" fill="#450a0a" stroke="#f87171"/><text x="385" y="686" class="p">超预算 · 高风险 · 重复失败 · 无进展 → 停止或请求人工介入</text>
  <style>
    .t,.h{fill:#1f2933}.s{fill:#66717a}.p{fill:#3f4a52}.l{stroke:#365b73}
    rect{filter:none;rx:8px}
    stop[stop-color="#071426"]{stop-color:#f7f3eb} stop[stop-color="#24133b"]{stop-color:#ebe6dc}
    [fill="#0f172a"],[fill="#312e81"],[fill="#0c4a6e"],[fill="#134e4a"],[fill="#431407"],[fill="#4c1d45"],[fill="#3b0764"]{fill:#fffdf8}
    [fill="#450a0a"]{fill:#f2e4dc}
    [stroke="#818cf8"],[stroke="#38bdf8"],[stroke="#2dd4bf"],[stroke="#fb923c"],[stroke="#f472b6"],[stroke="#c084fc"]{stroke:#9aa4a8}
    [stroke="#f87171"]{stroke:#a9644c}[fill="#c4b5fd"]{fill:#365b73}
  </style>
</svg>
