name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - publication/article-notifications.json
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  notify:
    concurrency:
      group: telegram-content
      cancel-in-progress: false
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Notify Telegram Channel about new articles
        run: node automation/notify-new-articles.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BLOG_BASE_URL: https://ai.buleye.com
      - name: Save notification state
        run: |
          if git diff --quiet publication/article-notifications.json; then
            exit 0
          fi
          git config user.name "article-notification-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add publication/article-notifications.json
          git commit -m "content: record Telegram article notification"
          git pull --rebase origin main
          git push
