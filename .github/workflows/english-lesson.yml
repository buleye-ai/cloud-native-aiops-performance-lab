name: Daily English Reading

on:
  schedule:
    # UTC+8 08:17; stagger from the industry digest.
    - cron: "17 0 * * *"
    # UTC+8 20:37; avoid GitHub Actions load at the top/half hour.
    - cron: "37 12 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: Reading time
        required: true
        type: choice
        options:
          - morning
          - evening

permissions:
  contents: write

concurrency:
  group: telegram-content
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate and send reading
        run: |
          SLOT="${{ inputs.slot }}"
          if [ -z "$SLOT" ]; then
            if [ "${{ github.event.schedule }}" = "17 0 * * *" ]; then
              SLOT="morning"
            else
              SLOT="evening"
            fi
          fi
          node automation/generate-english-reading.mjs --slot "$SLOT"
        env:
          AI_PRIMARY_API_KEY: ${{ secrets.AI_PRIMARY_API_KEY }}
          AI_PRIMARY_BASE_URL: ${{ secrets.AI_PRIMARY_BASE_URL }}
          AI_PRIMARY_MODEL: ${{ secrets.AI_PRIMARY_MODEL }}
          AI_BACKUP_API_KEY: ${{ secrets.AI_BACKUP_API_KEY }}
          AI_BACKUP_BASE_URL: ${{ secrets.AI_BACKUP_BASE_URL }}
          AI_BACKUP_MODEL: ${{ secrets.AI_BACKUP_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_USER_ID: ${{ secrets.TELEGRAM_ADMIN_USER_ID }}
      - name: Save learning progress
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            exit 0
          fi
          git config user.name "english-reading-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add publication/english-reading-state.json
          git commit -m "content: record English reading progress"
          git pull --rebase origin main
          git push
